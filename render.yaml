# Render Blueprint: the whole backend as ONE free web service.
# Render → New → Blueprint → pick this repo. See docs/DEPLOYMENT.md for the full walkthrough.
#
# EMBED_WORKERS runs the delivery worker and alert scheduler inside the API process, and
# MIGRATE_ON_START applies migrations + seeds the demo at boot (free services have no
# pre-deploy step). On a paid plan, split them into separate services instead.
services:
  - type: web
    name: alertly-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EMBED_WORKERS
        value: 'true'
      - key: MIGRATE_ON_START
        value: 'true'
      # Free managed MySQL plans allow few connections; one shared pool is enough here.
      - key: DB_POOL_SIZE
        value: '5'
      - key: WORKER_CONCURRENCY
        value: '3'
      - key: PRICE_PROVIDER_DEFAULT
        value: simulated
      # Behind the Vercel rewrite every login comes from Vercel's IPs, so the per-IP login
      # limit is shared by all visitors; raise it so reviewers don't lock each other out.
      - key: LOGIN_RATE_LIMIT_PER_MIN
        value: '30'
      - key: REGISTER_RATE_LIMIT_PER_MIN
        value: '30'
      # Random 256-bit base64 values generated by Render on first deploy. Never change
      # ENCRYPTION_KEY afterwards: stored webhook secrets would become unreadable.
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # Asked for when you create the Blueprint:
      - key: DATABASE_URL # Aiven "Service URI": mysql://avnadmin:…@…:port/defaultdb?ssl-mode=REQUIRED
        sync: false
      - key: DATABASE_CA_CERT # Aiven "CA certificate" (paste the whole PEM)
        sync: false
      - key: WEB_ORIGIN # your Vercel URL, e.g. https://alertly-abhishek.vercel.app
        sync: false
      - key: DEMO_WEBHOOK_URL # optional: a https://webhook.site/… URL for live demo deliveries
        sync: false
      - key: RESEND_API_KEY # optional: real email delivery
        sync: false
      - key: EMAIL_FROM # optional, e.g. Alertly <onboarding@resend.dev>
        sync: false
