name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # A real MySQL 8 for the integration tests. Each test file creates its own database.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # API unit + integration tests (real MySQL) and web component tests
      - run: npm test
      # Production builds: esbuild bundles for the API, `next build` for the dashboard
      - run: npm run build

  docker:
    # Proves the Dockerfiles still build. Runs after the checks pass.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t alertly-api .
      - run: docker build -f apps/web/Dockerfile -t alertly-web .
