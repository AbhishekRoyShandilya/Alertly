# Local development services: `docker compose up -d` starts MySQL and Mailpit.
#
# The whole stack in containers (API, worker, scheduler, dashboard):
#   docker compose --profile app up --build
#   → dashboard http://localhost:3000 · API docs http://localhost:4000/docs · inbox http://localhost:8025
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: alertly
      MYSQL_USER: alertly
      MYSQL_PASSWORD: alertly
    command: ['--default-time-zone=+00:00']
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 3s
      retries: 20

  # Fake SMTP server with a web inbox at http://localhost:8025. Emails never leave your machine.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025'
      - '8025:8025'

  # ---------- full stack (profile "app") ----------

  # One-shot release step: apply migrations and seed the demo account, then exit.
  migrate:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: alertly-api
    command: ['sh', '-c', 'node dist/migrate.js && node dist/seed.js']
    env_file: .env.docker
    depends_on:
      mysql: { condition: service_healthy }

  api:
    profiles: [app]
    image: alertly-api
    command: ['node', 'dist/server.js']
    env_file: .env.docker
    ports:
      - '4000:4000'
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    profiles: [app]
    image: alertly-api
    command: ['node', 'dist/worker.js']
    env_file: .env.docker
    depends_on:
      migrate: { condition: service_completed_successfully }

  scheduler:
    profiles: [app]
    image: alertly-api
    command: ['node', 'dist/scheduler.js']
    env_file: .env.docker
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { API_URL: 'http://api:4000' }
    ports:
      - '3000:3000'
    depends_on: [api]

volumes:
  mysql-data:
